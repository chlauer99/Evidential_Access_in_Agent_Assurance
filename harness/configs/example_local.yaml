# Example: local OpenAI-compatible servers (vLLM, Ollama, llama.cpp server, LM Studio). No API keys (api_key_env empty).
#   vLLM:       vllm serve Qwen/Qwen2.5-7B-Instruct --port 8000            -> http://localhost:8000/v1
#   Ollama:     ollama serve; ollama pull llama3.1:8b                       -> http://localhost:11434/v1
#   llama.cpp:  llama-server -m model.gguf --port 8081                      -> http://localhost:8081/v1
#   LM Studio:  start the local server                                      -> http://localhost:1234/v1
# Port 8080 is taken by the FHIR server; do not start a model server there.
name: example_local
description: three local open-weight models (two of one family on the pilot tasks, one of another on all tasks)
expect_paper: false
fhir: {mode: auto, image: jyxsu6/medagentbench@sha256:3fb83d7ed71c5476f9eb6212bd440a909ef7505922bbc757dc488a8fc0701966, base_url: http://localhost:8080/fhir/, server_dir: mab_server, java_env: null}
pilot_tasks: {per_category: 3, seed: 2026}
models:
  qwen_large:
    name: Qwen2.5 14B (vLLM)
    developer: alibaba
    base_url: http://localhost:8000/v1
    api_key_env: ""            # local server: any key is accepted; the harness sends "EMPTY"
    model: Qwen/Qwen2.5-14B-Instruct
    temperature: 0.8
    max_output_tokens: 4096    # the prompt is about 8,000 tokens: start vLLM with --max-model-len >= 16384
    extra_body: null
    tpm: null
    rpm: null
    workers: 4
    lenient_actions: false
    strip_reasoning: false
    price_in: 0.0
    price_out: 0.0
  qwen_small:
    name: Qwen2.5 7B (Ollama)
    developer: alibaba
    base_url: http://localhost:11434/v1
    api_key_env: ""
    model: qwen2.5:7b-instruct
    temperature: 0.8
    max_output_tokens: 4096    # Ollama: set num_ctx >= 16384 in a Modelfile, the default context truncates the prompt
    extra_body: null
    tpm: null
    rpm: null
    workers: 1
    lenient_actions: false
    strip_reasoning: false
    price_in: 0.0
    price_out: 0.0
  llama:
    name: Llama 3.1 8B (llama.cpp)
    developer: meta
    base_url: http://localhost:8081/v1
    api_key_env: ""
    model: llama-3.1-8b-instruct
    temperature: 0.8
    max_output_tokens: 4096
    extra_body: null
    tpm: null
    rpm: null
    workers: 1
    lenient_actions: false
    strip_reasoning: false
    price_in: 0.0
    price_out: 0.0
agents:
  pilot_gpt41: {model: qwen_large, tasks: pilot, attempts: 8}
  pilot_gpt41mini: {model: qwen_small, tasks: pilot, attempts: 8}
  full_deepseekv32: {model: llama, tasks: all, attempts: 4}
controls: {judged: [control_replay, control_null], full: [full_control_replay, full_control_null]}
judges:
  gpt-4.1: {model: qwen_large, temperature: 0, max_tokens: 400, neutral: [pilot_gpt41, pilot_gpt41mini, control_replay, control_null], spec: [pilot_gpt41, control_replay, control_null]}
  gpt-4.1-mini: {model: qwen_small, temperature: 0, max_tokens: 400, neutral: [pilot_gpt41, pilot_gpt41mini, control_replay, control_null], spec: [pilot_gpt41, pilot_gpt41mini, control_replay, control_null]}
  deepseek-v3.2: {model: llama, temperature: 0, max_tokens: 400, neutral: [pilot_gpt41, pilot_gpt41mini, control_replay, control_null, full_deepseekv32], verify: [pilot_gpt41, pilot_gpt41mini, control_replay, control_null], access: true}
record_access: {judge: deepseek-v3.2, max_queries: 4, sample_seed: 2027, workers: 1}
probes: {model: llama, samples: 3, temperature: 0.8, max_tokens: 200, workers: 1}
cue: {agent: full_deepseekv32, attempts: 2}
