# Fresh mixed-model run: GPT-OSS agent/probes/cue; Qwen judge in all evidence conditions.
# GPT-OSS: low reasoning. Qwen: thinking disabled. Three workers per model stage.
# single_model selects the one-agent/one-judge analysis layout; endpoints are distinct.
name: gpt_oss_120b_qwen_judge_exp_1
design: single_model
description: GPT-OSS 120B agent and Qwen3.8 27B judge, 300 tasks x 4 attempts, four evidence conditions, no pilots
expect_paper: false
fhir: {mode: docker, image: jyxsu6/medagentbench@sha256:3fb83d7ed71c5476f9eb6212bd440a909ef7505922bbc757dc488a8fc0701966, base_url: http://localhost:8080/fhir/, server_dir: mab_server, java_env: null}
models:
  oss_full:
    name: GPT-OSS 120B
    developer: openai
    base_url: http://192.168.92.194:10121/v1
    api_key_env: ""
    model: openai/gpt-oss-120b
    temperature: 0.8
    max_output_tokens: 8192
    extra_body: {reasoning_effort: low}
    tpm: null
    rpm: null
    workers: 3
    lenient_actions: false
    strip_reasoning: true
    price_in: 0.0
    price_out: 0.0
  qwen_full:
    name: Qwen3.8 27B
    developer: qwen
    base_url: http://192.168.92.194:10122/v1
    api_key_env: ""
    model: Qwen/Qwen3.8-27B
    temperature: 0.8
    max_output_tokens: 8192
    min_context_tokens: 70000
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
    tpm: null
    rpm: null
    workers: 3
    lenient_actions: false
    strip_reasoning: true
    price_in: 0.0
    price_out: 0.0
agents:
  full_deepseekv32: {model: oss_full, tasks: all, attempts: 4}
controls: {tasks: all, judged: [full_control_replay, control_null], full: []}
judges:
  qwen3_8_27b:
    model: qwen_full
    structured_output: true
    temperature: 0
    max_tokens: 4096
    neutral: [full_deepseekv32, full_control_replay, control_null]
    spec: [full_deepseekv32, full_control_replay, control_null]
    verify: [full_deepseekv32, full_control_replay, control_null]
    access: true
record_access: {continue_on_errors: true, judge: qwen3_8_27b, max_queries: 4, sample_seed: 2027, workers: 3}
probes: {model: oss_full, samples: 3, temperature: 0.8, max_tokens: 8192, workers: 3}
cue: {agent: full_deepseekv32, attempts: 2}
